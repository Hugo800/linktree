name: Pages preview

# Preview of this branch on GitHub Pages: https://hugo800.github.io/linktree/
# Pages serves the site under /linktree/, hence --base. The live tiles need the nginx routes
# /live/* of the real server and stay "not reachable" here.
on:
  push:
    branches: [feat/seiten-live-kacheln]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build for /linktree/
        run: npx tsc && npx vite build --base=/linktree/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
