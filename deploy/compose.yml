# Linktree unter https://hugobarthelmess.de. Davor sitzt der nginx vom web-stack
# (/opt/web-stack auf dem OTC-Server), der TLS beendet und hierher weiterreicht.
name: linktree
services:
  linktree:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      pull: true   # fresh base images (security fixes) on every deploy
    container_name: linktree
    restart: unless-stopped
    networks: [web]

  # Statistics for /#admin (stats/server.mjs), reached only through the linktree nginx (/api/).
  # ADMIN_PASSWORD comes from ~/linktree/stats.env on the server (chmod 600, not in the repo);
  # without it the page is still counted but the dashboard stays locked.
  stats:
    build:
      context: ..
      dockerfile: stats/Dockerfile
      pull: true
    container_name: linktree-stats
    restart: unless-stopped
    env_file:
      - path: ../../stats.env
        required: false
    volumes:
      - stats-data:/data
    networks: [web]

volumes:
  stats-data:
networks:
  web:
    external: true
    name: web-stack_default
