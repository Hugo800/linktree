server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    charset utf-8;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Everything is served from this origin; the grain texture is an inline SVG (data:).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Hashed build files may stay cached for a long time. ^~ keeps the file-extension regex
    # below from taking over these paths.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Entry points are always revalidated. sw.js removes the old Padel Score service worker
    # and must never be served stale.
    location ~ ^/(sw\.js|boot\.js|index\.html)$ {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /index.html =404;
    }

    # Live tiles: same-origin paths to the neighbouring containers on the web-stack network, so
    # the CSP stays at 'self'. Names are resolved at request time (Docker DNS), so nginx still
    # starts when a container is down; the tile then shows "not reachable".
    location = /live/padel {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $padel padel-score;
        proxy_pass http://$padel:3001/healthz;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ISS orbit from the TLE mirror of Orbital Atlas (it fetches CelesTrak at most every 2 h).
    location = /live/iss.tle {
        resolver 127.0.0.11 valid=300s ipv6=off;
        set $tracker satellite-tracker;
        proxy_pass http://$tracker/tle/gp.php?GROUP=stations&FORMAT=tle;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        add_header Cache-Control "public, max-age=900" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # A missing file (e.g. /avatar.jpg before there is a photo, old Padel Score icons) is a real
    # 404, not the start page with 200.
    location ~ \.[A-Za-z0-9]+$ { try_files $uri =404; }

    # Any other path goes to the start page (old Padel Score routes included).
    location / { try_files $uri $uri/ /index.html; }
}
